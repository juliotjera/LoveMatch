# À chaque envoi : tests du serveur sur H2 et sur PostgreSQL, compilation de l'interface, puis parcours complets
# dans un vrai navigateur (Playwright, téléphone et ordinateur) avec contrôle d'accessibilité.
name: Tests

on:
  push:
  pull_request:

jobs:
  serveur:
    name: Serveur (${{ matrix.base }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [h2, postgresql]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lovematch
          POSTGRES_USER: lovematch
          POSTGRES_PASSWORD: lovematch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lovematch" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Tests
        working-directory: backend
        run: |
          chmod +x mvnw
          if [ "${{ matrix.base }}" = "postgresql" ]; then
            export DB_URL=jdbc:postgresql://localhost:5432/lovematch DB_USERNAME=lovematch DB_PASSWORD=lovematch
          fi
          ./mvnw -B -ntp test

  interface:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilation
        working-directory: frontend
        run: |
          npm ci
          npm run traductions
          npx ng build --configuration production
          npm audit --omit=dev --audit-level=high

  bout-en-bout:
    name: Bout en bout (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # la même application que l'image Docker : Spring Boot sert l'interface compilée
      - name: Construction de l'application complète
        run: |
          cd frontend
          npm ci
          npx ng build --configuration production
          cd ..
          mkdir -p backend/src/main/resources/static
          cp -r frontend/dist/frontend/browser/. backend/src/main/resources/static/
          cd backend
          chmod +x mvnw
          ./mvnw -B -ntp -q -DskipTests package

      - name: Démarrage du serveur
        run: |
          nohup java -jar backend/target/lovematch-1.0.0.jar > serveur.log 2>&1 &
          for i in $(seq 1 60); do grep -q "Démonstration prête" serveur.log && break; sleep 2; done
          curl -sf http://localhost:8090/actuator/health

      - name: Navigateur
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        working-directory: frontend
        run: npx playwright test

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            frontend/playwright-report
            frontend/test-results
            serveur.log
