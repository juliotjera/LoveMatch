# À chaque envoi : tests du serveur sur H2 et sur PostgreSQL (la base de production), compilation de l'interface.
name: Tests

on:
  push:
  pull_request:

jobs:
  serveur:
    name: Serveur (${{ matrix.base }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [h2, postgresql]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lovematch
          POSTGRES_USER: lovematch
          POSTGRES_PASSWORD: lovematch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lovematch" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Tests
        working-directory: backend
        run: |
          chmod +x mvnw
          if [ "${{ matrix.base }}" = "postgresql" ]; then
            export DB_URL=jdbc:postgresql://localhost:5432/lovematch DB_USERNAME=lovematch DB_PASSWORD=lovematch
          fi
          ./mvnw -B -ntp test

  interface:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilation
        working-directory: frontend
        run: |
          npm ci
          npm run traductions
          npx ng build --configuration production
          npm audit --omit=dev --audit-level=high
